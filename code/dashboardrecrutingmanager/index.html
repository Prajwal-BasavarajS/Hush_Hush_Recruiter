<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Corp. | Secure Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        /* ... (All CSS from the previous version remains the same) ... */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap');
        :root { --bg-primary: #171717; --bg-secondary: rgba(38, 38, 38, 0.7); --border-color: rgba(82, 82, 82, 0.5); --text-primary: #f5f5f5; --text-secondary: #a3a3a3; --accent-primary: #34d399; --accent-glow: rgba(52, 211, 153, 0.25); --danger-glow: rgba(244, 63, 94, 0.3); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); overflow: hidden; background-image: radial-gradient(circle at center, #262626 0%, #171717 70%); }
        #challenge-container { backdrop-filter: blur(24px) saturate(150%); border: 1px solid var(--border-color); background: var(--bg-secondary); }
        .btn { transition: all 0.2s ease-in-out; } .btn-primary { background-color: var(--accent-primary); color: #171717; } .btn-primary:hover:not(:disabled) { background-color: #6ee7b7; transform: scale(1.05); box-shadow: 0 0 20px var(--accent-glow); } .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .editor-wrapper { display: flex; background-color: #2d2d2d; border: 1px solid var(--border-color); border-radius: 0.5rem; overflow: hidden; }
        .line-numbers { font-family: 'Roboto Mono', monospace; padding: 1rem; text-align: right; color: var(--text-secondary); background-color: #2d2d2d; user-select: none; font-size: 0.875rem; border-right: 1px solid var(--border-color); }
        pre[class*="language-"] { margin: 0; padding: 1rem; flex-grow: 1; overflow: auto; }
        pre[class*="language-"] > code[class*="language-"] { font-family: 'Roboto Mono', monospace; font-size: 0.875rem; line-height: 1.5; }
        #console-panel { background-color: #1f1f1f; border-top: 1px solid var(--border-color); font-family: 'Roboto Mono', monospace; font-size: 0.875rem; color: var(--text-secondary); }
        .console-output.success { color: #34d399; }
        .console-output.error { color: #f43f5e; }
        #resize-handle { width: 6px; cursor: col-resize; background-color: var(--border-color); } #resize-handle:hover { background-color: var(--accent-primary); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } @keyframes modal-in { from { transform: translateY(20px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        .modal-content { animation: modal-in 0.3s ease-out forwards; border: 1px solid var(--border-color); background: var(--bg-secondary); }
        .loader { width: 20px; height: 20px; border: 2px solid currentColor; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; } @keyframes rotation { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">
    <div id="challenge-container" class="w-full max-w-7xl h-[90vh] rounded-2xl shadow-2xl overflow-hidden relative flex flex-col"></div>
    <div id="message-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="modal-content max-w-md w-full rounded-lg shadow-lg p-8 text-center">
            <h2 id="modal-title" class="text-3xl font-bold text-white mb-4"></h2> <p id="modal-message" class="text-slate-300 mb-8 text-lg"></p>
            <button id="modal-close-btn" class="btn btn-primary font-bold py-3 px-8 rounded-lg text-lg">Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <script type="module">
        const BACKEND_URL = 'http://localhost:3000';
        const EXAM_DURATION_SECONDS = 3600;
        
        // UPDATED: Added a simple 'test' property to each question for the smart simulation
        const questionBank = [
            { id: 1, title: "Two Sum", description: "Given an array `nums` and a `target`, return indices of the two numbers such that they add up to `target`.", template: "def two_sum(nums, target):\n  # Your code here\n  pass", test: { contains: "two_sum" } },
            { id: 2, title: "Valid Palindrome", description: "Given a string `s`, return true if it is a palindrome, or false otherwise.", template: "def is_palindrome(s):\n  # Your code here\n  pass", test: { contains: "is_palindrome" } },
            { id: 3, title: "Valid Anagram", description: "Given two strings `s` and `t`, return true if `t` is an anagram of `s`.", template: "def is_anagram(s, t):\n  # Your code here\n  pass", test: { contains: "is_anagram" } },
            { id: 4, title: "Reverse String", description: "Write a function that reverses a string.", template: "def reverse_string(s):\n  # Your code here\n  pass", test: { contains: "reverse_string" } },
            { id: 5, title: "FizzBuzz", description: "Write a program that outputs string representations of numbers from 1 to `n`.", template: "def fizz_buzz(n):\n  # Your code here\n  pass", test: { contains: "fizz_buzz" } },
            { id: 13, title: "Longest Substring Without Repeating Characters", description: "Given a string `s`, find the length of the longest substring without repeating characters.", template: "def length_of_longest_substring(s):\n  # Your code here\n  pass", test: { contains: "length_of_longest_substring" } }
        ];

        // ... (state, modal, and render functions are the same) ...
        let state = { view: 'start', selectedQuestions: [], currentQuestionIndex: 0, solutions: [] };
        const container = document.getElementById('challenge-container');
        const modal = document.getElementById('message-modal');
        modal.querySelector('#modal-close-btn').addEventListener('click', () => { modal.classList.add('hidden'); if (state.view === 'success') render('start'); });
        function showModal(title, message) { modal.querySelector('#modal-title').textContent = title; modal.querySelector('#modal-message').textContent = message; modal.classList.remove('hidden'); }
        function render(viewName) {
            state.view = viewName; container.innerHTML = '';
            if (viewName === 'start') {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-full p-8 text-center" style="animation:fadeIn 0.5s ease-out;"><h1 class="text-5xl font-bold text-emerald-400">Coding Challenge</h1><p class="text-slate-300 text-lg mt-4 max-w-xl">Enter your details to begin.</p><div class="mt-10 w-full max-w-sm"><input type="text" id="candidate-name" class="w-full p-4 rounded-lg bg-slate-900/50 border border-slate-700 focus:border-emerald-400 outline-none text-center mb-4" placeholder="Full Name" required><input type="email" id="candidate-email" class="w-full p-4 rounded-lg bg-slate-900/50 border border-slate-700 focus:border-emerald-400 outline-none text-center" placeholder="Email Address" required><button id="start-btn" class="btn btn-primary mt-6 w-full font-bold py-4 rounded-lg text-lg">Start Assessment</button></div></div>`;
                document.getElementById('start-btn').addEventListener('click', () => {
                    const name = document.getElementById('candidate-name').value.trim(); const email = document.getElementById('candidate-email').value.trim();
                    if (!name || !email) return showModal("Information Required", "Please enter both name and email.");
                    state.candidateName = name; state.candidateEmail = email; state.selectedQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 3);
                    state.solutions = state.selectedQuestions.map(q => q.template || '');
                    render('exam');
                });
            } else if (viewName === 'exam') {
                container.innerHTML = `<header class="p-4 border-b border-slate-700/50 flex justify-between items-center"><h2 class="font-bold text-lg">${state.candidateName}</h2><div id="timer" class="text-lg font-mono bg-slate-900/50 border border-slate-700 rounded-md px-3 py-1">60:00</div></header><main id="exam-main" class="flex-1 flex overflow-hidden"><div id="q-panel" class="w-1/2 p-6 overflow-y-auto"><h3 id="q-title" class="text-2xl font-bold text-emerald-400 mb-4"></h3><p id="q-desc" class="text-slate-300 leading-relaxed"></p></div><div id="resize-handle"></div><div id="editor-area" class="w-1/2 p-6 flex flex-col"><div class="editor-wrapper flex-1"><div id="line-numbers" class="line-numbers">1</div><pre class="language-python"><code id="code-editor" class="language-python" contenteditable="true" spellcheck="false"></code></pre></div><div id="console-panel" class="h-32 p-4 overflow-y-auto hidden"><div id="console-output"></div></div></div></main><footer class="p-4 border-t border-slate-700/50 flex justify-between items-center"><div><button id="prev-btn" class="btn btn-primary p-3 rounded-md">Previous</button><button id="reset-btn" class="btn bg-gray-600 text-white p-3 rounded-md ml-2">Reset Code</button></div><div><button id="run-btn" class="btn bg-sky-500 text-white font-bold p-3 rounded-md">Run Code</button><button id="next-btn" class="btn btn-primary p-3 rounded-md mx-2">Next</button><button id="submit-btn" class="btn btn-primary font-bold p-3 rounded-md hidden"><span id="btn-text">Submit</span><div id="btn-loader" class="loader hidden"></div></button></div></footer>`;
                loadQuestion(state.currentQuestionIndex); setupEditorAndResize(); startTimer();
                document.getElementById('prev-btn').addEventListener('click', () => navigate(-1));
                document.getElementById('next-btn').addEventListener('click', () => navigate(1));
                document.getElementById('submit-btn').addEventListener('click', handleSubmit);
                document.getElementById('run-btn').addEventListener('click', handleRunCode);
                document.getElementById('reset-btn').addEventListener('click', handleResetCode);
            } else if (viewName === 'success') { showModal("Submission Successful", "Your results have been recorded."); }
        }

        // ... (loadQuestion, updateLineNumbers, navigate, updateNav functions are the same as the previous version) ...
        function loadQuestion(index) {
            const q = state.selectedQuestions[index];
            document.getElementById('q-title').textContent = `${index + 1}. ${q.title}`;
            document.getElementById('q-desc').innerHTML = q.description.replace(/`(.*?)`/g, '<code class="bg-slate-800 text-emerald-400 font-mono p-1 rounded">$1</code>');
            const editor = document.getElementById('code-editor');
            editor.textContent = state.solutions[index];
            Prism.highlightElement(editor);
            updateLineNumbers();
            updateNav(index);
        }
        function updateLineNumbers() {
            const editor = document.getElementById('code-editor');
            const lineNumbers = document.getElementById('line-numbers');
            const lines = editor.textContent.split('\n').length;
            lineNumbers.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
        }
        function navigate(dir) {
            state.solutions[state.currentQuestionIndex] = document.getElementById('code-editor').textContent;
            const newIndex = state.currentQuestionIndex + dir;
            if (newIndex >= 0 && newIndex < state.selectedQuestions.length) {
                state.currentQuestionIndex = newIndex;
                loadQuestion(newIndex);
            }
        }
        function updateNav(index) {
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').style.display = index === state.selectedQuestions.length - 1 ? 'none' : 'inline-flex';
            document.getElementById('submit-btn').style.display = index === state.selectedQuestions.length - 1 ? 'inline-flex' : 'none';
        }

        // UPDATED: handleRunCode now performs a simple check on the code
        function handleRunCode() {
            const consolePanel = document.getElementById('console-panel');
            const consoleOutput = document.getElementById('console-output');
            const editor = document.getElementById('code-editor');
            const currentQuestion = state.selectedQuestions[state.currentQuestionIndex];
            const userCode = editor.textContent;

            consolePanel.classList.remove('hidden');
            consoleOutput.className = 'console-output';
            consoleOutput.textContent = 'Running sample test cases...';

            // Simulate a network delay
            setTimeout(() => {
                // Perform a simple check, e.g., does the code contain the expected function name?
                if (currentQuestion.test && userCode.includes(currentQuestion.test.contains)) {
                    consoleOutput.textContent = '> Test Case 1: Passed\n> Test Case 2: Passed\n\n✅ Success: All sample tests passed!';
                    consoleOutput.classList.add('success');
                } else {
                    consoleOutput.textContent = `> Test Case 1: Failed\n\n❌ Error: Function '${currentQuestion.test.contains}' not found or modified. Please stick to the provided template.`;
                    consoleOutput.classList.add('error');
                }
            }, 1500);
        }
        
        function handleResetCode() {
            const currentQuestion = state.selectedQuestions[state.currentQuestionIndex];
            state.solutions[state.currentQuestionIndex] = currentQuestion.template || '';
            loadQuestion(state.currentQuestionIndex);
        }
        
        async function handleSubmit() {
            state.solutions[state.currentQuestionIndex] = document.getElementById('code-editor').textContent;
            setLoading(true);
            try {
                const response = await fetch(`${BACKEND_URL}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        candidateName: state.candidateName,
                        candidateEmail: state.candidateEmail,
                        submissions: state.selectedQuestions.map((q, i) => ({ ...q, code: state.solutions[i] }))
                    })
                });
                if (!response.ok) throw new Error((await response.json()).error || 'Server error');
                render('success');
            } catch (err) {
                showModal("Submission Error", err.message);
            } finally {
                setLoading(false);
            }
        }
        function setLoading(isLoading) { const btn = document.getElementById('submit-btn'); if (!btn) return; btn.disabled = isLoading; btn.querySelector('#btn-text').textContent = isLoading ? 'Evaluating' : 'Submit'; btn.querySelector('#btn-loader').classList.toggle('hidden', !isLoading); }
        
        function setupEditorAndResize() {
            const editor = document.getElementById('code-editor'), handle = document.getElementById('resize-handle'), qPanel = document.getElementById('q-panel');
            editor.addEventListener('input', () => { updateLineNumbers(); }); // Simplified for contenteditable
            editor.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const selection = window.getSelection(); const range = selection.getRangeAt(0);
                    const textNode = range.startContainer; const text = textNode.textContent || '';
                    const cursorPosition = range.startOffset; const textBeforeCursor = text.substring(0, cursorPosition);
                    const currentLine = textBeforeCursor.split('\n').pop() || '';
                    const indentMatch = currentLine.match(/^\s*/); let indent = indentMatch ? indentMatch[0] : '';
                    if (currentLine.trim().endsWith(':')) { indent += '  '; }
                    document.execCommand('insertText', false, '\n' + indent);
                }
            });
            let isResizing = false; handle.addEventListener('mousedown', () => isResizing = true); document.addEventListener('mouseup', () => isResizing = false);
            document.addEventListener('mousemove', e => { if (isResizing) { const newLeftWidth = (e.clientX - container.offsetLeft) / container.offsetWidth * 100; if (newLeftWidth > 20 && newLeftWidth < 80) qPanel.style.width = `${newLeftWidth}%`; } });
        }
        function startTimer() { let timeLeft = EXAM_DURATION_SECONDS; const timerEl = document.getElementById('timer'); const interval = setInterval(() => { timeLeft--; timerEl.textContent = `${String(Math.floor(timeLeft/60)).padStart(2, '0')}:${String(timeLeft%60).padStart(2, '0')}`; if (timeLeft <= 0) { clearInterval(interval); handleSubmit(); } }, 1000); }
        render('start');
    </script>
</body>
</html>
