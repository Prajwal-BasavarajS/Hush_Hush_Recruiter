<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Corp. | Hiring Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-primary: #171717; --bg-secondary: rgba(38, 38, 38, 0.7); --border-color: rgba(82, 82, 82, 0.5); --text-primary: #f5f5f5; --accent-primary: #34d399; --accent-accept: #34d399; --accent-reject: #f43f5e; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); background-image: radial-gradient(circle at center, #262626 0%, #171717 70%); }
        .container-box { backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); border: 1px solid var(--border-color); background: var(--bg-secondary); }
        .btn { transition: all 0.2s ease-in-out; } .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn-accept { background-color: var(--accent-accept); color: #171717; } .btn-reject { background-color: var(--accent-reject); color: #f5f5f5; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">
    <div id="login-view" class="w-full max-w-md p-8 rounded-2xl shadow-2xl container-box">
        <h1 class="text-4xl font-bold text-emerald-400 text-center">Manager Login</h1>
        <p class="text-slate-300 text-center mt-2">Access the candidate dashboard.</p>
        <form id="login-form" class="mt-8 space-y-6">
            <input type="text" id="username" class="w-full p-4 rounded-lg bg-slate-900/50 border border-slate-700 focus:border-emerald-400 outline-none" placeholder="Username" required value="manager">
            <input type="password" id="password" class="w-full p-4 rounded-lg bg-slate-900/50 border border-slate-700 focus:border-emerald-400 outline-none" placeholder="Password" required value="password123">
            <button type="submit" class="w-full font-bold py-4 rounded-lg text-lg bg-emerald-500 text-slate-900 hover:bg-emerald-400 transition-colors">Login</button>
            <p id="login-error" class="text-rose-500 text-center h-4"></p>
        </form>
    </div>
    <div id="dashboard-view" class="w-full max-w-7xl h-[90vh] rounded-2xl shadow-2xl container-box flex-col hidden">
        <header class="p-4 border-b border-slate-700/50 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-emerald-400">Candidate Submissions</h1>
            <button id="refresh-btn" class="font-bold py-2 px-4 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors">Refresh</button>
        </header>
        <main class="flex-1 overflow-y-auto p-4">
            <div class="relative overflow-x-auto">
                <table class="w-full text-left"><thead class="border-b border-slate-600"><tr><th class="p-3">Candidate Name</th><th class="p-3">Email</th><th class="p-3 text-center">Score</th><th class="p-3 text-center">Action</th></tr></thead><tbody id="candidates-tbody"></tbody></table>
            </div>
        </main>
    </div>
    <script>
        const BACKEND_URL = 'http://localhost:3000';
        const loginView = document.getElementById('login-view'), dashboardView = document.getElementById('dashboard-view'), loginForm = document.getElementById('login-form'), loginError = document.getElementById('login-error'), candidatesTbody = document.getElementById('candidates-tbody'), refreshBtn = document.getElementById('refresh-btn');
        loginForm.addEventListener('submit', async e => {
            e.preventDefault(); loginError.textContent = '';
            try {
                const response = await fetch(`${BACKEND_URL}/manager/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username.value, password: password.value }) });
                if (!response.ok) throw new Error((await response.json()).error || 'Login failed');
                loginView.classList.add('hidden'); dashboardView.classList.remove('hidden'); dashboardView.classList.add('flex'); fetchCandidates();
            } catch (error) { loginError.textContent = error.message; }
        });
        refreshBtn.addEventListener('click', fetchCandidates);
        async function fetchCandidates() {
            try {
                const response = await fetch(`${BACKEND_URL}/manager/candidates`); if (!response.ok) throw new Error('Failed to fetch candidates.');
                renderCandidates(await response.json());
            } catch (error) { candidatesTbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-rose-500">${error.message}</td></tr>`; }
        }
        function renderCandidates(candidates) {
            candidatesTbody.innerHTML = ''; if (candidates.length === 0) { candidatesTbody.innerHTML = `<tr><td colspan="4" class="text-center p-8 text-slate-400">No submissions yet.</td></tr>`; return; }
            candidates.forEach(c => {
                const actionButtons = `<button class="btn btn-accept text-sm font-bold py-1 px-3 rounded" data-id="${c.id}" data-name="${c.candidate_name}" data-email="${c.candidate_email}" data-decision="Accepted">Accept</button> <button class="btn btn-reject text-sm font-bold py-1 px-3 rounded ml-2" data-id="${c.id}" data-name="${c.candidate_name}" data-email="${c.candidate_email}" data-decision="Rejected">Reject</button>`;
                candidatesTbody.insertAdjacentHTML('beforeend', `<tr class="border-b border-slate-800 hover:bg-slate-800/50"><td class="p-3 font-medium">${c.candidate_name}</td><td class="p-3 text-slate-400">${c.candidate_email}</td><td class="p-3 text-center font-mono text-lg">${c.score}</td><td class="p-3 text-center" id="action-cell-${c.id}">${actionButtons}</td></tr>`);
            });
        }
        candidatesTbody.addEventListener('click', async e => {
            if (e.target.matches('.btn-accept, .btn-reject')) {
                const { id, name, email, decision } = e.target.dataset; const actionCell = document.getElementById(`action-cell-${id}`);
                actionCell.innerHTML = `<span class="text-slate-500">Sending Email...</span>`;
                try {
                    const response = await fetch(`${BACKEND_URL}/manager/decide`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision, name, email }) });
                    if (!response.ok) throw new Error((await response.json()).error || 'Action failed.');
                    const statusColor = decision === 'Accepted' ? 'text-emerald-400' : 'text-rose-500'; actionCell.innerHTML = `<span class="font-bold ${statusColor}">${decision} (Email Sent)</span>`;
                } catch (error) { actionCell.innerHTML = `<span class="text-rose-500">${error.message}</span>`; }
            }
        });
    </script>
</body>
</html>
